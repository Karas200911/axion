name: publish to PyPI

# Runs when a release is published on GitHub (Releases -> Draft a new release).
# The tag must be "v" + the version in pyproject.toml, for example v0.3.0.
# No password or token is stored anywhere: PyPI trusts this workflow ("Trusted Publishing").

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject.toml: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "__version__ = \"$version\"" axionlang/__init__.py || { echo "axionlang/__init__.py has another __version__"; exit 1; }
          if grep -rq "YOUR-GITHUB-NAME" README.md pyproject.toml; then echo "Replace YOUR-GITHUB-NAME first"; exit 1; fi
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/axionlang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
