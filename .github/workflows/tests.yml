name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build the package and use it from outside the source folder
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import axionlang, sys; r = axionlang.run('print 1 + 2', {}); print(r.output); sys.exit(0 if r.output == ['3'] else 1)"
          axionlang "$GITHUB_WORKSPACE/examples/cart.ax" --input "$GITHUB_WORKSPACE/examples/cart.json"
